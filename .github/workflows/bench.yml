name: Bench

# The bench (simd) job records benchmark evidence, which only has value when
# the SIMD crate (or what it depends on) changes; unrelated PRs skip it. The
# job is deliberately NOT a required check (see AGENTS.md): its speedup
# factors are environment-dependent and recorded, never gated. There is no
# disassembly gate: the naive float baseline preserves summation order by
# language semantics, so no conforming compiler can vectorize it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/vectordb-simd/**
      - crates/vectordb-core/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/bench.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/vectordb-simd/**
      - crates/vectordb-core/**

permissions:
  contents: read

jobs:
  bench:
    name: bench (simd)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            simd_require: avx2
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            simd_require: "neon:f32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: bench-${{ matrix.target }}
      - name: Test benchmark internals
        env:
          VECTORDB_SIMD_REQUIRE: ${{ matrix.simd_require }}
        run: >-
          cargo test -p vectordb-simd --features bench-internals
          --target ${{ matrix.target }}
      - name: Record criterion benchmarks
        shell: bash
        # Drop criterion state restored from the cache: stale group directories
        # from renamed/removed benchmarks would otherwise pollute the uploaded
        # artifact and skew criterion's change-vs-baseline comparisons.
        run: |
          rm -rf target/criterion
          cargo bench -p vectordb-simd --features bench-internals \
            --target ${{ matrix.target }} -- --noplot | tee bench.log
      - name: Record speedup report
        env:
          VECTORDB_SIMD_REQUIRE: ${{ matrix.simd_require }}
        shell: bash
        run: >-
          cargo test -p vectordb-simd --release --features bench-internals
          --target ${{ matrix.target }}
          -- --ignored speedup_report --nocapture | tee speedup.log
      - name: Upload benchmark records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simd-bench-${{ matrix.name }}
          path: |
            bench.log
            speedup.log
            target/criterion
          if-no-files-found: error
          retention-days: 90
